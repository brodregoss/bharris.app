    <title>bharris.app</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bharris-theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#1e1c1a');
          }
        } catch (e) {}
        try {
          var params = new URLSearchParams(window.location.search);
          var mode = params.get('mode');
          var code = params.get('oobCode');
          if (mode === 'resetPassword' && code && window.location.hash.indexOf('/account/reset') === -1) {
            window.location.replace(
              window.location.pathname
              + '#/account/reset?mode=' + encodeURIComponent(mode)
              + '&oobCode=' + encodeURIComponent(code)
            );
          }
        } catch (e) {}
      })();
    </script>
